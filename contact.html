<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupanshi Dhiman | Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --primary-light: #A5B4FC;
            --text: #1F2937;
            --text-light: #6B7280;
            --background: #FFFFFF;
            --surface: #F9FAFB;
            --surface-dark: #F3F4F6;
            --accent: #10B981;
            --error: #EF4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--background);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            padding: 100px 0;
        }

        h1, h2, h3, h4 {
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2.5rem;
        }

        p {
            margin-bottom: 1.5rem;
            color: var(--text-light);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px 0;
            transition: var(--transition);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header.scrolled {
            padding: 15px 0;
            box-shadow: var(--shadow);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
        }

        .nav-menu a {
            font-weight: 500;
            position: relative;
            padding: 5px 0;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
        }

        .nav-menu a:hover::after,
        .nav-menu a.active::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
        }

        /* Contact Section */
        .contact {
            padding: 180px 0 120px;
            background: linear-gradient(135deg, #F0F4FF 0%, #FFFFFF 100%);
            position: relative;
            overflow: hidden;
        }

        .contact::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light) 0%, transparent 70%);
            opacity: 0.3;
        }

        .contact-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .section-header {
            margin-bottom: 60px;
        }

        .section-title {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        .contact-pitch {
            font-size: 1.2rem;
            line-height: 1.7;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 400px;
            margin: 0 auto 50px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .contact-icon {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .contact-details h3 {
            margin-bottom: 5px;
            font-size: 1.2rem;
        }

        .contact-details p {
            margin-bottom: 0;
            color: var(--text-light);
        }

        .contact-details a {
            color: var(--primary);
            text-decoration: underline;
        }

        .contact-details a:hover {
            color: var(--primary-dark);
        }

        .social-links {
            margin-top: 50px;
        }

        .social-links p {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--surface-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .social-link:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        /* Footer */
        .footer {
            background: var(--text);
            color: white;
            padding: 40px 0;
            text-align: center;
        }

        .footer p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 0;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            h2 {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            
            .menu-toggle {
                display: block;
            }
            
            .contact {
                padding: 140px 0 80px;
            }
            
            section {
                padding: 80px 0;
            }
            
            .contact-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
        }

        @media (max-width: 576px) {
            .container {
                padding: 0 15px;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            .contact-item {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">Rupanshi Dhiman</a>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="work.html">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <button class="menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <main>
        <section id="contact" class="contact section">
            <div class="container">
                <div class="contact-content">
                    <div class="section-header">
                        <h2 class="section-title">Get in Touch</h2>
                        <p class="contact-pitch">Feel free to reach out to me via email or connect with me on LinkedIn and Behance.</p>
                    </div>

                    <div class="contact-info">
                        <div class="contact-item">
                            <div class="contact-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="contact-details">
                                <h3>Email</h3>
                                <p><a href="mailto:hello@rupanshi.com">rupanshidhiman7@gmail.com</a></p>
                            </div>
                        </div>
                    </div>

                    <div class="social-links">
                        <p>Connect with me:</p>
                        <div class="social-icons">
                            <a href="https://www.linkedin.com/in/rupanshi-dhiman-358a882a1?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app" class="social-link" aria-label="LinkedIn" target="_blank">
                                <i class="fab fa-linkedin-in"></i>
                            </a>
                            <a href="https://www.behance.net/rupanshidhiman" class="social-link" aria-label="Behance" target="_blank">
                                <i class="fab fa-behance"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year"></span> Rupanshi Dhiman. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Header scroll effect
            const header = document.querySelector('.header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Mobile navigation toggle
            const menuToggle = document.querySelector('.menu-toggle');
            const navMenu = document.querySelector('.nav-menu');
            
            menuToggle.addEventListener('click', () => {
                navMenu.style.display = navMenu.style.display === 'flex' ? 'none' : 'flex';
                menuToggle.querySelector('i').classList.toggle('fa-bars');
                menuToggle.querySelector('i').classList.toggle('fa-times');
            });

            // Set current year in footer
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Active navigation highlighting
            const navLinks = document.querySelectorAll('.nav-menu a');
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';

            navLinks.forEach(link => {
                let linkHref = link.getAttribute('href').split('/').pop();
                if (linkHref === '' || linkHref.startsWith('#')) linkHref = 'index.html'; 

                if (linkHref === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
